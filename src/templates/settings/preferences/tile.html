<script type="text/html" id="templates/settings/preferences/tile.html">
  <div class="preferences-panel-tile">
    <div class="settings-item">
      <label>
        Enable tile mode
        <input type="checkbox" value="1" class="tile-mode-checkbox" name="tile-mode-checkbox"/>
      </label>
    </div>

    <div class="settings-item">
      <label>Mask opacity</label>
      <input type="range" min="0" max="0.5" step="0.01"
        class="settings-opacity-input tile-mask-opacity-input" name="tile-mask-opacity"/>
      <span class="settings-opacity-text tile-mask-opacity-text"></span>
    </div>

    <div class="settings-item">
      <label for="cycle-mode-select">Cycle mode</label>
      <select
        id="cycle-mode-select"
        class="cycle-mode-select"
        name="cycle-mode"
      >
        <option value="0">Off</option>
        <option value="3">3x3</option>
        <option value="5">5x5</option>
      </select>
      <div class="settings-description">
        Copies around the frame are editable and their edges connect.
      </div>
    </div>
  </div>
</script>
